name: "Forklift"
description: "Keep a fork up to date with its upstream: rules, an agent for the conflicts, and checks before anything lands"
branding:
  icon: "git-pull-request"
  color: "yellow"

inputs:
  command:
    description: "`build`, `publish`, `sync` (both at once) or `check`"
    required: false
    default: "sync"
  args:
    description: "Arguments for the command, e.g. `--out forklift.bundle` for build"
    required: false
    default: ""
  token:
    description: "Token for the fork. `build` needs read access at most. `publish` and `sync` need to push and open pull requests: the default token cannot push changes to workflow files, and pull requests it opens do not start other workflows, so pass a GitHub App's credentials (FORKLIFT_APP_ID and FORKLIFT_APP_PRIVATE_KEY in `env`) or a personal access token."
    required: false
    default: ${{ github.token }}
  working-directory:
    description: "Directory of the fork's checkout"
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    - name: Build Forklift
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        npm install --global --no-fund --no-audit pnpm@12.21.0
        pnpm install --frozen-lockfile
        pnpm bundle

    - name: Run Forklift
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ inputs.token }}
        FORKLIFT_COMMAND: ${{ inputs.command }}
        FORKLIFT_ARGS: ${{ inputs.args }}
      run: |
        # shellcheck disable=SC2086
        node "$GITHUB_ACTION_PATH/dist/forklift.cjs" "$FORKLIFT_COMMAND" $FORKLIFT_ARGS
